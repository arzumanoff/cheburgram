[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/audio",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["arzumanoff"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
cpal = "0.15"
audiopus = "0.2"
audiopus_sys = { version = "0.2", features = ["static"] }
rubato = "0.16"
ringbuf = "0.3"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.27"
tray-icon = "0.14"
winreg = "0.52"
